# application-prod.properties
app.environment=PROD

####### MySQL Siva Data-Source Properties #######
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/storybot?createDatabaseIfNotExist=true
spring.datasource.username={user_name}
spring.datasource.password={password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
logging.level.org.hibernate.orm.connections.pooling=WARN

# Google
#google.client.id=${GOOGLE_CLIENT_ID}
#google.client.secret=${GOOGLE_CLIENT_SECRET}
#google.refresh.token=${GOOGLE_REFRESH_TOKEN}
#google.redirect.uri=https://developers.google.com/oauthplayground

#Telegram Messenger
# Bot Owner (Amir)
telegram.bot.username:{BOT_NAME}
telegram.bot.token={BOT_TOKEN}
telegram.owner.id={BOT_ID}
telegram.owner.username={OWNER_USER_NAME}


# ========================================
# Groq AI API Configuration (FREE)
# ========================================
# Get your API key from: https://console.groq.com
# Sign up with Google - No credit card needed!
groq.api.key=${GROQ_API_KEY}
groq.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile
# Alternative models (all FREE):
# groq.model=llama3-8b-8192
# groq.model=llama3-70b-8192
# groq.model=gemma2-9b-it
# groq.model=mistral-8x7b-32768

# Groq API Settings
groq.max.tokens=500
groq.temperature=0.7
groq.timeout-seconds=30000